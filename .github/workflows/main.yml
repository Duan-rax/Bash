name: Mihomo Ruleset Compiler
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Mihomo Binary
        run: |
          # 明确指定版本，避免获取到有 Bug 的预发布版
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gunzip mihomo-linux-amd64-v1.18.3.gz
          mv mihomo-linux-amd64-v1.18.3 mihomo
          chmod +x mihomo

      - name: Process and Compile
        run: |
          mkdir -p output
          # 遍历 rules 目录
          for file in rules/*.txt; do
            [ -e "$file" ] || continue
            filename=$(basename "$file" .txt)
            echo "Building $filename.mrs from $file..."
            
            # 【关键修改】：使用更加明确的绝对路径和子命令格式
            # 强制使用 domain 模式转换
            ./mihomo -f "$file" convert ruleset domain "$file" "./output/${filename}.mrs"
            
            # 如果上面命令报错或产生阻塞，下面的检测会起作用
            if [ ! -f "./output/${filename}.mrs" ]; then
              echo "Compilation failed for $filename"
              exit 1
            fi
          done

      - name: Release MRS Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: output/*.mrs
          body: "Rules compiled at $(date +'%Y-%m-%d %H:%M:%S')"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
