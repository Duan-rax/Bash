name: Mihomo MRS Compiler
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Mihomo Binary
        run: |
          # 获取最新 Alpha 或 Stable 版本，确保支持 convert-ruleset
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz
          gunzip mihomo-linux-amd64-${VERSION}.gz
          mv mihomo-linux-amd64-${VERSION} mihomo
          chmod +x mihomo

      - name: Compile Rules
        run: |
          mkdir -p output
          for file in rules/*.yaml; do
            [ -e "$file" ] || continue
            filename=$(basename "$file" .yaml)
            echo "Converting $filename to MRS..."
            
            # 使用你查到的最新指令格式
            # 逻辑：判断文件名或内容，默认使用 domain 转换
            if [[ "$filename" == *"ip"* ]]; then
              ./mihomo convert-ruleset ipcidr yaml "$file" "output/${filename}.mrs"
            else
              ./mihomo convert-ruleset domain yaml "$file" "output/${filename}.mrs"
            fi
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: output/*.mrs
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
