name: Auto Compile MRS Ruleset
on:
  push:
    paths:
      - 'rules/*.txt' # 建议把源文件放在 rules 文件夹下
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # 赋予发布权限
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mihomo
        run: |
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz
          gunzip mihomo-linux-amd64-${VERSION}.gz
          chmod +x mihomo-linux-amd64-${VERSION}
          mv mihomo-linux-amd64-${VERSION} mihomo

      - name: Batch Compile Rules
        run: |
          mkdir -p output
          for file in rules/*.txt; do
            filename=$(basename "$file" .txt)
            echo "Compiling $filename..."
            # 自动判断：如果文件包含 IP 段则用 ipset，否则用 domain
            if grep -E "([0-9]{1,3}\.){3}[0-9]{1,3}" "$file" > /dev/null; then
              ./mihomo convert ruleset ipset "$file" "output/${filename}.mrs"
            else
              ./mihomo convert ruleset domain "$file" "output/${filename}.mrs"
            fi
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: output/*.mrs
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
